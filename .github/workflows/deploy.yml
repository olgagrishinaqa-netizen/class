name: Class Site CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # Авторизация через JSON-ключ сервисного аккаунта
    - name: Yandex Cloud Auth
      uses: yc-actions/yc-ycctl-Setup@v1
      with:
        yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

    # Генерируем временный IAM-токен для Docker и Terraform из JSON-ключа
    - name: Get IAM Token
      id: token
      run: |
        IAM_TOKEN=$(yc iam create-token)
        echo "::add-mask::$IAM_TOKEN"
        echo "iam_token=$IAM_TOKEN" >> $GITHUB_OUTPUT

    - name: Configure Docker for Yandex Registry
      run: |
        yc container registry configure-docker --token=${{ steps.token.outputs.iam_token }}

    - name: Build and Push Docker Image
      run: |
        docker build -t cr.yandex/crp7cl7iq7aba09i8kd0/class-site:v1 .
        docker push cr.yandex/crp7cl7iq7aba09i8kd0/class-site:v1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Terraform Init and Apply
      run: |
        terraform init
        terraform apply -var="yc_token=${{ steps.token.outputs.iam_token }}" -replace="yandex_serverless_container.class_container" -auto-approve
      env:
        YC_TOKEN: ${{ steps.token.outputs.iam_token }}
