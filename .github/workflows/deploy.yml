name: Class Site Production CI/CD

on:
  push:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Quality Control
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Code Review (Flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-deploy:
    name: Enterprise Release & Infrastructure Deployment
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Получаем короткий хэш коммита для уникального тега (например, d3b4c1a)
    - name: Get Short Git SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Authenticate in Yandex Cloud
      id: yc-auth
      uses: yandex-cloud/yc-actions-setup@v1
      with:
        max-retries: 3
        yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

    - name: Configure Cloud Docker Authorization
      run: |
        yc container registry configure-docker --token=${{ steps.yc-auth.outputs.yc-iam-token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Собираем образ с УНИКАЛЬНЫМ тегом на основе хэша коммита
    - name: Build and Push Production Container
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: cr.yandex/crp7cl7iq7aba09i8kd0/class-site:${{ steps.vars.outputs.sha_short }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Setup Terraform Environment
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.5.7"

    # Передаем уникальный тег в Terraform как переменную, чтобы он обновил контейнер в облаке
    - name: Execute Infrastructure as Code (IaC)
      run: |
        terraform init
        terraform apply \
          -var="yc_token=${{ steps.yc-auth.outputs.yc-iam-token }}" \
          -var="image_tag=${{ steps.vars.outputs.sha_short }}" \
          -auto-approve
      env:
        YC_TOKEN: ${{ steps.yc-auth.outputs.yc-iam-token }}
