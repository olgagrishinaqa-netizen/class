name: Class Site Production CI/CD

on:
  push:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Quality Control
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Code Review (Flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-deploy:
    name: Enterprise Release & Infrastructure Deployment
    needs: lint-and-test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Получаем короткий хэш коммита для уникального тега (DevOps Best Practice)
    - name: Get Short Git SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # Стабильная и чистая установка бинарного файла yc напрямую через curl
    - name: Install Yandex Cloud CLI Binary
      run: |
        curl -sSL -O https://yandexcloud.net
        chmod +x yc
        sudo mv yc /usr/local/bin/yc

    # Авторизуемся через ваш секретный JSON-ключ сервисного аккаунта
    - name: Authenticate and Get IAM Token
      id: yclogin
      run: |
        echo '${{ secrets.YC_SA_JSON_CREDENTIALS }}' > sa_key.json
        yc config profile create sa-profile || true
        yc config set service-account-key sa_key.json
        yc config set folder-id b1g7f31a1r5b3kl9b3f7
        
        # Генерируем IAM-токен
        IAM_TOKEN=$(yc iam create-token)
        echo "::add-mask::$IAM_TOKEN"
        echo "iam_token=$IAM_TOKEN" >> $GITHUB_OUTPUT
        rm sa_key.json

    # Логинимся в реестр через полученный токен
    - name: Log in to Yandex Container Registry
      run: |
        echo "${{ steps.yclogin.outputs.iam_token }}" | docker login --username iam --password-stdin cr.yandex

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Сборка и пуш с уникальным тегом коммита (Immutable Tags)
    - name: Build and Push Production Container
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: cr.yandex/crp7cl7iq7aba09i8kd0/class-site:${{ steps.vars.outputs.sha_short }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Setup Terraform Environment
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.5.7"

    # Применяем изменения инфраструктуры через Terraform
    - name: Execute Infrastructure as Code (IaC)
      run: |
        terraform init
        terraform apply \
          -var="yc_token=${{ steps.yclogin.outputs.iam_token }}" \
          -var="image_tag=${{ steps.vars.outputs.sha_short }}" \
          -auto-approve
      env:
        YC_TOKEN: ${{ steps.yclogin.outputs.iam_token }}
