name: Class Site Production CI/CD

on:
  push:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Quality Control
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Code Review (Flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-deploy:
    name: Enterprise Release & Infrastructure Deployment
    needs: lint-and-test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Получаем уникальный тег на основе короткого хэша коммита Git (DevOps Best Practice)
    - name: Get Short Git SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # Официальный автоматический скрипт Яндекса
    - name: Install Yandex Cloud CLI via Official Script
      run: |
        curl -sSL https://yandexcloud.net | bash -s -- -a
        echo "/home/runner/yandex-cloud/bin" >> $GITHUB_PATH

    # ИСПРАВЛЕННЫЙ БЛОК: Безопасная авторизация через переменную окружения без echo
    - name: Authenticate in Yandex Cloud
      id: yclogin
      run: |
        yc config profile create sa-profile || true
        
        # Передаем секрет напрямую из переменной окружения, сохраняя структуру JSON
        yc config set service-account-key <(echo "$KEY_DATA")
        yc config set folder-id b1g7f31a1r5b3kl9b3f7
        
        # Генерируем IAM-токен для Docker и Terraform
        IAM_TOKEN=$(yc iam create-token)
        echo "::add-mask::$IAM_TOKEN"
        echo "iam_token=$IAM_TOKEN" >> $GITHUB_OUTPUT
      env:
        KEY_DATA: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

    # Настраиваем нативный Docker для авторизации в реестре Яндекса
    - name: Configure Cloud Docker Authorization
      run: |
        yc container registry configure-docker --token=${{ steps.yclogin.outputs.iam_token }}

    # НАЧАЛО БЛОКА DOCKER ИЗ ВАШЕГО ЗАДАНИЯ ДИПЛОМА
    - name: Build Production Container Image
      run: |
        docker build -t cr.yandex/crp7cl7iq7aba09i8kd0/class-site:${{ steps.vars.outputs.sha_short }} .

    - name: Push Container Image to Yandex Registry
      run: |
        docker push cr.yandex/crp7cl7iq7aba09i8kd0/class-site:${{ steps.vars.outputs.sha_short }}

    # НАЧАЛО БЛОКА TERRAFORM ИЗ ВАШЕГО ЗАДАНИЯ ДИПЛОМА
    - name: Setup Terraform Environment
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.5.7"

    - name: Execute Infrastructure as Code (IaC)
      run: |
        terraform init
        terraform apply \
          -var="yc_token=${{ steps.yclogin.outputs.iam_token }}" \
          -var="image_tag=${{ steps.vars.outputs.sha_short }}" \
          -auto-approve
      env:
        YC_TOKEN: ${{ steps.yclogin.outputs.iam_token }}
