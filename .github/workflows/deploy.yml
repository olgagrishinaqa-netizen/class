name: Class Site CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # Стабильная установка утилиты yc напрямую в систему Linux гитхаба
    - name: Install Yandex Cloud CLI
      run: |
        curl -sSL https://yandexcloud.net | bash -s -- -i /usr/local/bin -n

    # Авторизуемся через ваш секретный JSON-ключ сервисного аккаунта
    - name: Authenticate in Yandex Cloud
      id: yclogin
      run: |
        echo '${{ secrets.YC_SA_JSON_CREDENTIALS }}' > sa_key.json
        yc config profile create sa-profile || true
        yc config set service-account-key sa_key.json
        yc config set folder-id b1g7f31a1r5b3kl9b3f7
        
        # Генерируем IAM-токен для Docker и Terraform
        IAM_TOKEN=$(yc iam create-token)
        echo "::add-mask::$IAM_TOKEN"
        echo "iam_token=$IAM_TOKEN" >> $GITHUB_OUTPUT
        rm sa_key.json

    - name: Configure Docker for Yandex Registry
      run: |
        yc container registry configure-docker --token=${{ Administrative_token.outputs.iam_token || steps.yclogin.outputs.iam_token }}

    - name: Build and Push Docker Image
      run: |
        docker build -t cr.yandex/crp7cl7iq7aba09i8kd0/class-site:v1 .
        docker push cr.yandex/crp7cl7iq7aba09i8kd0/class-site:v1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Terraform Init and Apply
      run: |
        terraform init
        terraform apply -var="yc_token=${{ steps.yclogin.outputs.iam_token }}" -replace="yandex_serverless_container.class_container" -auto-approve
      env:
        YC_TOKEN: ${{ steps.yclogin.outputs.iam_token }}
