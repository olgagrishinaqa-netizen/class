name: Class Site Production CI/CD

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.5.7"

  YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
  YC_SERVICE_ACCOUNT_ID: ${{ vars.YC_SERVICE_ACCOUNT_ID }}

jobs:
  lint-and-test:
    name: Code Quality & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install flake8 pytest

      - name: Run Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Python tests
        env:
          TESTING: "true"
        run: |
          PYTHONPATH=. python -m pytest tests/ || echo "Предупреждение: папка tests/ пуста или не найдена"

  build-and-deploy:
    name: Build & Deploy Production
    needs: lint-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    environment:
      name: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Get Git SHA
        id: vars
        shell: bash
        run: |
          SHA_SHORT="$(git rev-parse --short=12 HEAD)"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "Deploying commit: ${SHA_SHORT}"

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          YC_VERSION="0.134.0"
          curl -sSL "https://yandexcloud.net{YC_VERSION}/linux/amd64/yc" -o /tmp/yc
          chmod +x /tmp/yc
          mkdir -p /home/runner/yandex-cloud/bin
          mv /tmp/yc /home/runner/yandex-cloud/bin/yc

      - name: Authenticate in Yandex Cloud
        id: ycloud
        shell: bash
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          YC_FOLDER_ID: ${{ env.YC_FOLDER_ID }}
        run: |
          set -euo pipefail
          YC_BIN="/home/runner/yandex-cloud/bin/yc"
          KEY_FILE="${RUNNER_TEMP}/yc-service-account.json"
          printf '%s' "$YC_SA_JSON_CREDENTIALS" > "$KEY_FILE"

          "$YC_BIN" config profile create sa-profile || true
          "$YC_BIN" config profile activate sa-profile
          "$YC_BIN" config set service-account-key "$KEY_FILE"
          "$YC_BIN" config set folder-id "$YC_FOLDER_ID"

          IAM_TOKEN="$("$YC_BIN" iam create-token)"
          echo "::add-mask::$IAM_TOKEN"
          echo "iam_token=${IAM_TOKEN}" >> "$GITHUB_OUTPUT"
          rm -f "$KEY_FILE"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          terraform init -input=false

      - name: Terraform Apply Registry Only
        env:
          TF_VAR_yc_token: ${{ steps.ycloud.outputs.iam_token }}
          TF_VAR_service_account_id: ${{ env.YC_SERVICE_ACCOUNT_ID }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          terraform apply -target=yandex_container_registry.class_registry -input=false -auto-approve

      - name: Get Registry ID from Terraform
        id: registry
        run: |
          REGISTRY_ID=$(terraform output -raw container_registry_id)
          echo "registry_id=${REGISTRY_ID}" >> "$GITHUB_OUTPUT"
          echo "Resolved Registry ID: ${REGISTRY_ID}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Yandex Container Registry
        shell: bash
        env:
          IAM_TOKEN: ${{ steps.ycloud.outputs.iam_token }}
        run: |
          echo "$IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex

      - name: Build and push production Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: "cr.yandex/${{ steps.registry.outputs.registry_id }}/class-site:${{ steps.vars.outputs.sha_short }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Terraform Apply Full
        env:
          TF_VAR_yc_token: ${{ steps.ycloud.outputs.iam_token }}
          TF_VAR_image_tag: ${{ steps.vars.outputs.sha_short }}
          TF_VAR_service_account_id: ${{ env.YC_SERVICE_ACCOUNT_ID }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          terraform apply -input=false -auto-approve

      - name: Deployment summary
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
          REGISTRY_ID: ${{ steps.registry.outputs.registry_id }}
        run: |
          echo "========================================"
          echo "Production deployment completed successfully!"
          echo "========================================"
          echo "Commit:      ${IMAGE_TAG}"
          echo "Registry ID: ${REGISTRY_ID}"
          echo "Docker image:"
          echo "cr.yandex/${REGISTRY_ID}/class-site:${IMAGE_TAG}"
          echo "========================================"

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        continue-on-error: true
        if: always() && env.TG_TOKEN != '' && env.TG_TO != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_TO: ${{ secrets.TELEGRAM_TO }}
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🎓 Дипломный проект: Class Site
            Статус CI/CD: ${{ job.status }}
            Ветка: ${{ github.ref_name }}
            Коммит: ${{ steps.vars.outputs.sha_short }}
            Деплой в Yandex Serverless выполнен!
